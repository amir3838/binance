<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binance Earn Local</title>
  <style>
    :root { --bg:#071118; --panel:#111b22; --text:#edf3f8; --muted:#9aa5b2; --gold:#f0b90b; --line:rgba(255,255,255,.08); }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:radial-gradient(circle at top,#122128 0%,#0d161d 25%,#071118 100%); color:var(--text); }
    a { color:inherit; text-decoration:none; }
    .top { display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--line); background:rgba(8,13,18,.96); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; }
    .logo { width:16px; height:16px; background:var(--gold); border-radius:50%; box-shadow: 0 0 0 4px rgba(240,185,11,.12); }
    .nav { display:flex; gap:18px; color:var(--muted); font-size:13px; }
    .nav a.active { color:var(--text); border-bottom:2px solid var(--gold); padding-bottom:8px; }
    .actions { display:flex; gap:10px; }
    .btn { padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.02); color:var(--text); }
    .btn.primary { background:var(--gold); color:#10161b; border-color:var(--gold); font-weight:700; }
    main { max-width:1100px; margin:0 auto; padding:72px 18px 80px; }
    .panel { background: rgba(17,23,29,.96); border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:0 12px 18px rgba(0,0,0,.18); }
    h1 { font-size:clamp(2.2rem,5vw,4rem); margin:0; }
    .sub { margin-top:18px; color:var(--muted); font-size:1.05rem; line-height:1.9; }
    .cards { display:grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:30px; }
    .card { padding:18px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.02); }
    .card strong { display:block; font-size:1.1rem; margin-bottom:8px; }
    .card span { color:var(--muted); }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo"></span><span>BINANCE</span></div>
    <nav class="nav">
      <a href="/ar/markets/overview/">الأسواق</a>
      <a href="/ar/earn/" class="active">التمويل</a>
      <a href="/ar/futures/home/">المشتقات</a>
      <a href="/ar/my/wallet/account/overview/">المحفظة</a>
    </nav>
    <div class="actions">
      <a class="btn" href="/ar/">العربية</a>
      <a class="btn primary" href="/ar/my/wallet/account/overview/">محفظة</a>
    </div>
  </header>
  <main>
    <div class="panel">
      <h1>Binance Earn</h1>
      <div class="sub">هذه نسخة محلية ثابتة من قسم الكسب والتمويل داخل المشروع. جميع الروابط تفتح صفحات محلية متاحة ضمن الموقع المحلي.</div>
      <div class="cards">
        <div class="card"><strong>العائد</strong><span>+12.4%</span></div>
        <div class="card"><strong>الوديعة المجمدة</strong><span>6000 USDT</span></div>
        <div class="card"><strong>الحالة</strong><span>بايننس برو</span></div>
      </div>
    </div>
  </main>
</body>
</html>
